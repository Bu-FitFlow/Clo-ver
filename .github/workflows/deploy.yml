name: Clo-ver Spring boot Deploy to DigitalOcean

on:
  push:
    branches: [ "main" ]
    paths:
      -'server/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server
    
    steps:
      - name: 최신 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 환경 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: application-prod.yaml 파일 생성
        run:
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_PROD_YAML }}" > src/main/resource/application-prod.yaml

      - name: Gradle 권한 부여 및 프로젝트 빌드
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 빌드된 jar 파일을 Droplet으로 자동 전송 (scp)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "server/build/libs/clover-0.0.1-SNAPSHOT.jar"
          target: "/root/clover"
          strip_components: 3

      - name: Droplet 서버 접속 후 기존 앱 종료 및 새 앱 실행 (ssh)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script:
            cd /root/clover
            fuser -k 8080/tcp || true
            nohup java -Dspring.profiles.active=prod -jar clover-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
