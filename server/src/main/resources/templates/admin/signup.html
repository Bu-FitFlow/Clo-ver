<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clo-ver Admin - 관리자 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/signup.css}" type="text/css">
</head>
<body class="auth-wrapper">

<div class="auth-container wide">
    <h2>관리자 계정 등록</h2>

    <form method="post" onsubmit="return validateForm()" th:action="@{/signup}">
        <div class="input-group">
            <label for="loginId">아이디</label>
            <input id="loginId" name="loginId" required type="text">
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input id="password" name="password" placeholder="영문, 숫자 포함 8자 이상" required type="password">
            <span id="passwordError" style="color: red; font-size: 0.85em; display: none;">비밀번호는 영문, 숫자를 포함하여 8자 이상이어야 합니다.</span>
        </div>

        <div class="input-group">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" placeholder="비밀번호 다시 입력" required type="password">
            <span id="passwordMatchError" style="color: red; font-size: 0.85em; display: none;">비밀번호가 일치하지 않습니다.</span>
        </div>

        <div class="input-group">
            <label for="name">이름</label>
            <input id="name" name="name" required type="text">
        </div>
        <div class="input-group">
            <label for="email">이메일 주소</label>
            <input id="email" name="email" required type="email">
        </div>
        <button class="btn btn-success" type="submit">등록하기</button>
    </form>

    <div class="links">
        <a th:href="@{/login}">이미 계정이 있습니다 (로그인)</a>
    </div>
</div>

<script th:src="@{/js/signup.js}"></script>

</body>
</html>
