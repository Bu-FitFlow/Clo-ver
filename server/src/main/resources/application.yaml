spring:
  application:
    name: clover

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
  cloud:
    aws:
      credentials:
        access-key: ${DO_ACCESS_KEY}
        secret-key: ${DO_SECRET_KEY}
      region:
        static: sgp1
      s3:
        endpoint: https://sgp1.digitaloceanspaces.com
        bucket: cloverstorage

  data:
    redis:
      host: localhost
      port: 6379
  
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity-in-milliseconds: 1800000

